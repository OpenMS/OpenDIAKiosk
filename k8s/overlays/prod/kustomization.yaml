apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/memory-tier-high
  # Workspaces on S3 object storage (JuiceFS, k8s/storage-s3/) instead of
  # the Manila share. The size patch below still targets the Manila name;
  # the component renames the claim after it applies.
  - ../../components/storage-s3

namePrefix: opendiakiosk-

commonLabels:
  app: opendiakiosk

images:
  - name: openms-streamlit
    newName: ghcr.io/openms/opendiakiosk
    # A release image, not the deployed one: under Argo CD the app's ImageUpdater
    # (cluster configuration) sets the latest release on the Application. This tag is only where a new Application starts and the
    # name CI loads its test image under, so it need not follow releases.
    newTag: v-1.1-full

# This app's own values. k8s/base and k8s/components are the template's and
# arrive through the template sync; everything this app sets for itself is a
# patch here (docs/kubernetes-deployment.md, "App values belong in the overlay").
patches:
  - target:
      kind: IngressRoute
      name: streamlit-traefik
    patch: |
      - op: replace
        path: /spec/routes/0/match
        value: (Host(`opendia.webapps.openms.de`) || Host(`opendia.webapps.openms.org`)) && PathPrefix(`/`)
      - op: replace
        path: /spec/routes/0/services/0/name
        value: opendiakiosk-streamlit
      - op: replace
        path: /spec/routes/1/match
        value: (Host(`opendia.webapps.openms.de`) || Host(`opendia.webapps.openms.org`)) && PathPrefix(`/sync`)
      - op: replace
        path: /spec/routes/1/services/0/name
        value: opendiakiosk-sync
  # The workspace quota on S3 (deploy.k8s.storage in app.yaml).
  - target:
      kind: PersistentVolumeClaim
      name: workspaces-manila-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 20T
  - target:
      kind: Deployment
      name: streamlit
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "redis://opendiakiosk-redis:6379/0"
      # Streamlit size as deployed, larger than the tier's 4Gi limit.
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {memory: 512Mi, cpu: 500m}
          limits: {memory: 8Gi, cpu: "4"}
  - target:
      kind: Deployment
      name: sync
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "redis://opendiakiosk-redis:6379/0"
  - target:
      kind: Deployment
      name: rq-worker
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "redis://opendiakiosk-redis:6379/0"
      # Worker size as deployed: a small request with room to grow to the
      # tier's 180Gi, not the tier's Guaranteed 180Gi request.
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {memory: 2Gi, cpu: "2"}
          limits: {memory: 180Gi, cpu: "20"}
