apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kiosk-pvc
  annotations:
    # Argo CD: never prune or cascade-delete. On cinder-csi, deleting the claim
    # deletes the volume with every workspace on it.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: cinder-csi
  resources:
    requests:
      storage: 3Ti
