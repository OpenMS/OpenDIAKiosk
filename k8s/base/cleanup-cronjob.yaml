apiVersion: batch/v1
kind: CronJob
metadata:
  name: workspace-cleanup
  labels:
    component: cleanup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # concurrencyPolicy above is Forbid, so an Active Job suppresses every
      # later schedule. Without a deadline, one run wedged on the workspaces
      # mount silently blocks cleanup forever. The deadline forces the Job to
      # Failed, which is terminal, so the next night runs. The in-container
      # `timeout` below covers the reachable-but-slow cases.
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            component: cleanup
            volume-group: kiosk
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: volume-group
                        operator: In
                        values:
                          - kiosk
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: cleanup
              image: openms-streamlit
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  source /root/miniforge3/bin/activate streamlit-env
                  # Inside activeDeadlineSeconds (3600), so the Job still fails
                  # if this somehow outlives its own bound.
                  exec timeout -k 60 3000 python clean-up-workspaces.py
              env:
                - name: WORKSPACES_DIR
                  value: "/workspaces-streamlit-template"
              volumeMounts:
                - name: workspaces
                  mountPath: /workspaces-streamlit-template
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
          volumes:
            - name: workspaces
              persistentVolumeClaim:
                claimName: kiosk-pvc
