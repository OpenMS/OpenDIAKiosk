apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspaces-manila-pvc
  annotations:
    # Argo CD: never prune or cascade-delete; the claim holds every workspace.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  # A Manila NFS share (streamlit-template k8s/storage/): every node can mount
  # it, so the pods are no longer bound to the node of a Cinder volume.
  accessModes:
    - ReadWriteMany
  storageClassName: openms-manila-nfs
  resources:
    requests:
      # Counted against the project's Manila quota (1000 GiB, shared by every
      # app). Manila grows a share in place: raise this and let Argo CD apply it.
      storage: 200Gi
