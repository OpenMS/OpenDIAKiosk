apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openms

resources:
  - configmap.yaml
  - redis.yaml
  # The workspaces live on a Manila share (workspaces-manila-pvc). The old
  # RWO Cinder claim kiosk-pvc carried Prune=false, so Argo CD leaves it on
  # the cluster until it is deleted by hand.
  - workspace-pvc.yaml
  - streamlit-secrets.yaml
  - streamlit-deployment.yaml
  - streamlit-service.yaml
  - rq-worker-deployment.yaml
  - ingress.yaml
  - traefik-ingressroute.yaml
  - cleanup-cronjob.yaml
  - limitrange.yaml
