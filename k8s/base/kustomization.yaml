apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openms

resources:
  - configmap.yaml
  - redis.yaml
  # workspace-pvc.yaml (from the template) is left out: OpenDIAKiosk keeps
  # its workspaces on kiosk-pvc, and an unused claim stays Pending forever,
  # which holds the Argo CD application in Progressing.
  - kiosk-pvc.yaml
  - streamlit-secrets.yaml
  - streamlit-deployment.yaml
  - streamlit-service.yaml
  - rq-worker-deployment.yaml
  - ingress.yaml
  - traefik-ingressroute.yaml
  - cleanup-cronjob.yaml
  - limitrange.yaml
